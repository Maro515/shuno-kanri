      text: s.text || '', note: s.note || '', minutes: s.minutes || '', pause: s.pause || '',
      imageId: s.imageId || null, imageData: null, removeImage: false
    }));
    if (!editSteps.length) editSteps = [blankStep()];
  } else {
    editingRecipeId = null;
    document.getElementById('re-heading').textContent = '新しい手順書';
    document.getElementById('re-title').value = '';
    editSteps = [blankStep()];
  }
  currentSec = null;
  showView('view-recipe-edit');
  document.getElementById('hd-label').textContent = '手順書';
  renderEditSteps();
  window.scrollTo(0, 0);
}

function renderEditSteps() {
  const box = document.getElementById('re-steps');
  box.innerHTML = editSteps.map((s, i) => {
    let imgHtml;
    if (s.imageData) {
      imgHtml = `<img class="re-img-prev" src="${s.imageData}" alt="">
        <button type="button" class="re-img-btn" onclick="pickStepImage(${i})">変更</button>
        <button type="button" class="re-img-btn del" onclick="removeStepImage(${i})">削除</button>`;
    } else if (s.imageId && !s.removeImage) {
      imgHtml = `<img class="re-img-prev" id="re-prev-${i}" alt="">
        <button type="button" class="re-img-btn" onclick="pickStepImage(${i})">変更</button>
        <button type="button" class="re-img-btn del" onclick="removeStepImage(${i})">削除</button>`;
    } else {
      imgHtml = `<button type="button" class="re-img-btn" onclick="pickStepImage(${i})">📷 画像を追加</button>`;
    }
    return `
    <div class="re-card">
      <div class="re-step-head">
        <div class="re-step-no">${i + 1}</div>
        <span class="re-step-label">手順 ${i + 1}</span>
        <div class="re-step-tools">
          <button type="button" class="re-mini" onclick="moveEditStep(${i},-1)" ${i === 0 ? 'disabled' : ''} title="上へ">↑</button>
          <button type="button" class="re-mini" onclick="moveEditStep(${i},1)" ${i === editSteps.length - 1 ? 'disabled' : ''} title="下へ">↓</button>
          <button type="button" class="re-mini del" onclick="removeEditStep(${i})" title="この手順を削除">✕</button>
        </div>
      </div>
      <div class="fld"><label>手順の内容（必須）</label>
        <textarea class="re-text" oninput="updStep(${i},'text',this.value)">${esc(s.text)}</textarea></div>
      <div class="re-grid2">
        <div class="fld"><label>所要時間（例: 10分）</label>
          <input type="text" value="${esc(s.minutes)}" oninput="updStep(${i},'minutes',this.value)" autocomplete="off"></div>
        <div class="fld"><label>注釈（補足・コツなど）</label>
          <input type="text" value="${esc(s.note)}" oninput="updStep(${i},'note',this.value)" autocomplete="off"></div>
      </div>
      <div class="fld"><label>この手順のあと放置できる場合、その条件と時間（例: 冷蔵で一晩まで）。できない場合は空欄</label>
        <input type="text" value="${esc(s.pause)}" oninput="updStep(${i},'pause',this.value)" autocomplete="off"></div>
      <div class="fld" style="margin-bottom:0"><label>画像</label>
        <div class="re-img-row">${imgHtml}</div>
        <input type="file" id="re-file-${i}" accept="image/*" style="display:none" onchange="onStepImage(${i},this)">
      </div>
    </div>`;
  }).join('');
  editSteps.forEach((s, i) => {
    if (s.imageId && !s.removeImage && !s.imageData) {
      getImage(s.imageId).then(d => {
        const el = document.getElementById('re-prev-' + i);
        if (el && d) el.src = d;
      });
    }
  });
}

function updStep(i, f, v) { editSteps[i][f] = v; editDirty = true; }
function addEditStep() { editSteps.push(blankStep()); editDirty = true; renderEditSteps(); }
function removeEditStep(i) {
  if (editSteps.length === 1) editSteps = [blankStep()];
  else editSteps.splice(i, 1);
  editDirty = true;
  renderEditSteps();
}
function moveEditStep(i, d) {
  const j = i + d;
  if (j < 0 || j >= editSteps.length) return;
  const t = editSteps[i]; editSteps[i] = editSteps[j]; editSteps[j] = t;
  editDirty = true;
  renderEditSteps();
}
function pickStepImage(i) { document.getElementById('re-file-' + i).click(); }
function onStepImage(i, input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  resizeImage(f).then(dataUrl => {
    editSteps[i].imageData = dataUrl;
    editSteps[i].removeImage = false;
    editDirty = true;
    renderEditSteps();
  }).catch(() => showToast('画像を読み込めませんでした'));
}
function removeStepImage(i) {
  editSteps[i].imageData = null;
  if (editSteps[i].imageId) editSteps[i].removeImage = true;
  editDirty = true;
  renderEditSteps();
}

/* 画像を縮小してJPEGのdataURLに（Firestoreの1MB制限に収める） */
function resizeImage(file, maxDim, quality) {
  maxDim = maxDim || 800; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}

function saveRecipe() {
  if (!db) return;
  const title = document.getElementById('re-title').value.trim();
  if (!title) { showToast('タイトルを入力してください'); return; }
  const steps = editSteps.filter(s => s.text.trim());
  if (!steps.length) { showToast('手順を1つ以上入力してください'); return; }
  const btn = document.getElementById('re-save-btn');
  btn.disabled = true; btn.textContent = '保存中…';

  const recipeRef = editingRecipeId ? db.collection('recipes').doc(editingRecipeId) : db.collection('recipes').doc();
  // 置き換え・削除された旧画像を回収
  const toDelete = [];
  editSteps.forEach(s => { if (s.imageId && (s.removeImage || s.imageData)) toDelete.push(s.imageId); });
  if (editingRecipeId && state.recipes[editingRecipeId]) {
    const kept = new Set(steps.filter(s => !s.removeImage && !s.imageData).map(s => s.imageId).filter(Boolean));
    (state.recipes[editingRecipeId].steps || []).forEach(s => {
      if (s.imageId && !kept.has(s.imageId) && !toDelete.includes(s.imageId)) toDelete.push(s.imageId);
    });
  }
  // 新しい画像を順番にアップロード → 各手順の最終imageIdを確定
  const jobs = steps.map(s => () => {
    if (s.imageData) {
      return db.collection('recipeImages').add({ data: s.imageData, recipeId: recipeRef.id, ts: Date.now() })
        .then(ref => { imgCache[ref.id] = s.imageData; s._img = ref.id; });
    }
    s._img = s.removeImage ? null : (s.imageId || null);
    return Promise.resolve();
  });
  jobs.reduce((p, f) => p.then(f), Promise.resolve())
    .then(() => {
      const clean = steps.map(s => ({
        text: s.text.trim(), note: (s.note || '').trim(), minutes: (s.minutes || '').trim(),
        pause: (s.pause || '').trim(), imageId: s._img || null
      }));
      const now = Date.now();
      const me = currentUser ? currentUser.email : '';
      const data = { title, steps: clean, updatedAt: now, updatedBy: me };
      if (!editingRecipeId) { data.createdAt = now; data.createdBy = me; }
      return recipeRef.set(data, { merge: true });
    })
    .then(() => {
      if (toDelete.length) {
        const b = db.batch();
        toDelete.forEach(x => { b.delete(db.collection('recipeImages').doc(x)); delete imgCache[x]; });
        return b.commit().catch(() => {});
      }
    })
    .then(() => {
      editDirty = false;
      showToast('手順書を保存しました');
      openRecipe(recipeRef.id);
    })
    .catch(() => showToast('保存に失敗しました'))
    .finally(() => { btn.disabled = false; btn.textContent = '💾 保存する'; });
}

function cancelRecipeEdit() {
  if (editDirty && !confirm('編集内容を保存せずに閉じますか？')) return;
  editDirty = false;
  if (editingRecipeId && state.recipes[editingRecipeId]) openRecipe(editingRecipeId);
  else goHome();
}

/* ================= common ui ================= */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('show'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.show').forEach(m => m.classList.remove('show'));
    closeLightbox();
  }
});
document.getElementById('re-title').addEventListener('input', () => { editDirty = true; });
document.getElementById('mf-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); submitForm(); }
});
document.getElementById('ml-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); saveLabel(); }
});
document.getElementById('preset-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); addPreset(); }
});
document.getElementById('br-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); applyBulkRename(); }
});
['login-email', 'login-pass'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
  });
});

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

/* ================= Firebase / sync ================= */
let auth = null, db = null;
let currentUser = null;
let unsubItems = null, unsubLabels = null, unsubPresets = null, unsubRecent = null, unsubRecipes = null;
let firstLoaded = false;

const itemId = (sec, r, c) => `${sec}_${r}_${c}`;
const itemRef = (sec, r, c) => db.collection('items').doc(itemId(sec, r, c));
function addHistory(entry) {
  if (!db) return;
  db.collection('history').add(Object.assign({ ts: Date.now(), by: currentUser ? currentUser.email : '' }, entry)).catch(() => {});
}

function startSync() {
  if (unsubItems) return;
  unsubItems = db.collection('items').onSnapshot(snap => {
    const m = {};
    snap.forEach(doc => {
      const d = doc.data();
      m[`${d.sec}:${d.r}:${d.c}`] = { name: d.name, qty: d.qty || 1, note: d.note || '', addedAt: d.addedAt, addedBy: d.addedBy || '' };
    });
    state.items = m; firstLoaded = true; rerender();
  }, err => showToast('同期エラー: ' + (err.code || err.message)));
  unsubLabels = db.collection('labels').onSnapshot(snap => {
    const m = {};
    snap.forEach(doc => { m[doc.id] = doc.data().name; });
    state.labels = m; rerender();
  }, () => {});
  unsubPresets = db.collection('meta').doc('presets').onSnapshot(doc => {
    state.presets = (doc.exists && Array.isArray(doc.data().names)) ? doc.data().names : [];
    if (document.getElementById('m-presets').classList.contains('show')) renderPresetList();
    if (document.getElementById('m-form').classList.contains('show')) renderFormChips();
    if (document.getElementById('m-bulkname').classList.contains('show')) renderChips('br-chips', 'br-name');
  }, () => {});
  // 最近登録した品名（履歴の直近30件から add を抽出。複合インデックス不要）
  unsubRecent = db.collection('history').orderBy('ts', 'desc').limit(30).onSnapshot(snap => {
    const seen = new Set(), names = [];
    snap.forEach(d => { const h = d.data(); if (h.type === 'add' && h.name && !seen.has(h.name)) { seen.add(h.name); names.push(h.name); } });
    recentNames = names.slice(0, 5);
    renderRecent();
    if (document.getElementById('m-form').classList.contains('show')) renderFormChips();
  }, () => {});
  // 手順書
  unsubRecipes = db.collection('recipes').onSnapshot(snap => {
    const m = {};
    snap.forEach(doc => { m[doc.id] = doc.data(); });
    state.recipes = m;
    renderRecipeList();
    if (currentRecipeId && viewVisible('view-recipe')) {
      if (state.recipes[currentRecipeId]) renderRecipeDetail();
      else { showToast('この手順書は削除されました'); goHome(); }
    }
  }, () => {});
}
function stopSync() {
  if (unsubItems) { unsubItems(); unsubItems = null; }
  if (unsubLabels) { unsubLabels(); unsubLabels = null; }
  if (unsubPresets) { unsubPresets(); unsubPresets = null; }
  if (unsubRecent) { unsubRecent(); unsubRecent = null; }
  if (unsubRecipes) { unsubRecipes(); unsubRecipes = null; }
}
function rerender() {
  if (currentSec) renderSection(); else renderHome();
  if (searchInput.value) renderSearch();
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'ログイン中…';
  auth.signInWithEmailAndPassword(email, pass)
    .then(() => { document.getElementById('login-pass').value = ''; })
    .catch(e => { errEl.textContent = loginErrMsg(e.code); })
    .finally(() => { btn.disabled = false; btn.textContent = 'ログイン'; });
}
function loginErrMsg(code) {
  switch (code) {
    case 'auth/invalid-email': return 'メールアドレスの形式が正しくありません';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'メールアドレスまたはパスワードが違います';
    case 'auth/too-many-requests': return '試行回数が多すぎます。しばらくしてからお試しください';
    case 'auth/network-request-failed': return 'ネットワークに接続できません';
    default: return 'ログインに失敗しました（' + code + '）';
  }
}
function doLogout() {
  if (!auth || !currentUser) return;
  if (!confirm('ログアウトしますか？')) return;
  cancelMove();
  ['m-form', 'm-detail', 'm-label', 'm-history'].forEach(closeModal);
  currentSec = null;
  auth.signOut();
}

function initFirebase() {
  if (typeof firebase === 'undefined') {
    document.getElementById('login-overlay').classList.add('show');
    document.getElementById('login-error').textContent = 'インターネットに接続してから開き直してください';
    return;
  }
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  auth.onAuthStateChanged(user => {
    currentUser = user;
    const ov = document.getElementById('login-overlay');
    const logoutBtn = document.getElementById('hd-logout');
    if (user) {
      ov.classList.remove('show');
      if (logoutBtn) logoutBtn.title = 'ログアウト（' + user.email + '）';
      startSync();
    } else {
      stopSync();
      state.items = {}; state.labels = {}; state.presets = []; state.recipes = {}; recentNames = [];
      firstLoaded = false;
      selectMode = false; selected.clear(); moveFrom = null; moveMulti = null;
      currentRecipeId = null; editingRecipeId = null; editSteps = []; editDirty = false;
      Object.keys(imgCache).forEach(k => delete imgCache[k]);
      undoStack.length = 0; redoStack.length = 0; updateUndoUI();
      document.getElementById('select-bar').style.display = 'none';
      document.getElementById('move-banner').style.display = 'none';
      closeLightbox();
      goHome();
      ov.classList.add('show');
    }
  });
}

/* ================= start ================= */
goHome();
initFirebase();

/* offline support (works when served over http/https; skipped for file://) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
